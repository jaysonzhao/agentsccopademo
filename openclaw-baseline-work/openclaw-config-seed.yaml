apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
  namespace: openclaw-baseline
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"port\": 18789,\n    \"bind\": \"lan\"\
    ,\n    \"mode\": \"local\",\n    \"auth\": {\n      \"mode\": \"token\"\n    },\n\
    \    \"controlUi\": {\n      \"allowedOrigins\": [\n        \"https://openclaw-openclaw-baseline.apps.cluster-v4vsc.v4vsc.sandbox287.opentlc.com\"\
    ,\n        \"http://localhost:18789\",\n        \"http://127.0.0.1:18789\"\n \
    \     ]\n    }\n  },\n  \"channels\": {},\n  \"agents\": {\n    \"defaults\":\
    \ {\n      \"workspace\": \"/home/node/.openclaw/workspace\",\n      \"sandbox\"\
    : {\n        \"mode\": \"off\"\n      }\n    },\n    \"entries\": {\n      \"\
    main\": {\n        \"tools\": {\n          \"alsoAllow\": [\n            \"exec\"\
    ,\n            \"read\",\n            \"write\",\n            \"edit\",\n    \
    \        \"apply_patch\"\n          ]\n        }\n      }\n    }\n  },\n  \"tools\"\
    : {\n    \"profile\": \"full\",\n    \"elevated\": {\n      \"enabled\": false\n\
    \    },\n    \"fs\": {\n      \"workspaceOnly\": true\n    },\n    \"exec\": {\n\
    \      \"mode\": \"ask\",\n      \"host\": \"gateway\",\n      \"strictInlineEval\"\
    : true\n    },\n    \"deny\": [\n      \"group:plugins\"\n    ]\n  }\n}\n"
